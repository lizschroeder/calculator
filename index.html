<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AP Stats Calculator (Z & t)</title>

<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

.container {
  display: flex;
  gap: 20px;
}

.panel {
  width: 320px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.graph {
  flex: 1;
  height: 520px;
  background: white;
  border-radius: 10px;
}
input, select {
  width: 100%;
  margin: 6px 0;
  padding: 6px;
}
</style>
</head>

<body>

<h2>AP Stats Z / t Calculator</h2>

<div class="container">

<!-- CONTROLS -->
<div class="panel">

<label>Distribution</label>
<select id="dist">
  <option value="z">Z</option>
  <option value="t">t</option>
</select>

<label>Mode</label>
<select id="mode">
  <option value="left">P(Z < z₁)</option>
  <option value="right">P(Z > z₁)</option>
  <option value="between">P(z₁ < Z < z₂)</option>
  <option value="invnorm">invNorm</option>
</select>

<label>z₁</label>
<input id="z1" type="number" value="0" step="0.1">

<label>z₂</label>
<input id="z2" type="number" value="1" step="0.1">

<label>df (t only)</label>
<input id="df" type="number" value="10">

<div id="result" style="margin-top:10px;font-weight:bold;"></div>

</div>

<!-- GRAPH -->
<div id="box" class="graph"></div>

</div>

<script>

// ---------- BOARD ----------
const board = JXG.JSXGraph.initBoard('box', {
  boundingbox: [-4, 0.45, 4, -0.05],
  axis: true
});

// ---------- PDF ----------
function normal(x){
  return (1/Math.sqrt(2*Math.PI))*Math.exp(-0.5*x*x);
}

function t(x, df){
  return (1/Math.sqrt(df*Math.PI))*Math.pow(1+x*x/df, -(df+1)/2);
}

// ---------- NUMERIC INTEGRAL ----------
function integrate(f,a,b,df=null){
  let steps = 250;
  let h = (b-a)/steps;
  let sum = 0;

  for(let i=0;i<steps;i++){
    let x1 = a + i*h;
    let x2 = a + (i+1)*h;

    let y1 = df ? f(x1,df) : f(x1);
    let y2 = df ? f(x2,df) : f(x2);

    sum += (y1+y2)/2*h;
  }
  return sum;
}

// ---------- INVERSE NORMAL (approx) ----------
function invNorm(p){
  // Beasley-Springer-Moro approximation
  let a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924];
  let b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857];
  let c=[-0.00778489400243029,-0.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878];
  let d=[0.00778469570904146,0.32246712907004,2.445134137143,3.75440866190742];

  let q, r;

  if(p < 0.5){
    q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else {
    q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

// ---------- CURVE ----------
let curve = board.create('functiongraph',[normal,-4,4]);

let shade;

// ---------- UPDATE ----------
function update(){

  let dist = document.getElementById('dist').value;
  let mode = document.getElementById('mode').value;
  let z1 = parseFloat(document.getElementById('z1').value);
  let z2 = parseFloat(document.getElementById('z2').value);
  let df = parseFloat(document.getElementById('df').value);

  let pdf = (dist==='z') ? normal : (x)=>t(x,df);

  let area = 0;

  // ---------- REMOVE OLD SHADE ----------
  if(shade) board.removeObject(shade);

  // ---------- MODES ----------
  if(mode==='left'){
    area = integrate(pdf,-4,z1,dist==='t'?df:null);

    shade = board.create('curve',[
      Array.from({length:100},(_,i)=>-4+i*(z1+4)/99),
      Array.from({length:100},(_,i)=>pdf(-4+i*(z1+4)/99,dist==='t'?df:null))
    ],{fillOpacity:0.3});

  }

  else if(mode==='right'){
    area = integrate(pdf,z1,4,dist==='t'?df:null);

    shade = board.create('curve',[
      Array.from({length:100},(_,i)=>z1+i*(4-z1)/99),
      Array.from({length:100},(_,i)=>pdf(z1+i*(4-z1)/99,dist==='t'?df:null))
    ],{fillOpacity:0.3});
  }

  else if(mode==='between'){
    area = integrate(pdf,z1,z2,dist==='t'?df:null);

    let xs=[], ys=[];
    for(let i=0;i<100;i++){
      let x = z1 + i*(z2-z1)/99;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }

    shade = board.create('curve',[xs,ys],{fillOpacity:0.3});
  }

  else if(mode==='invnorm'){
    let z = invNorm(z1);
    document.getElementById('result').innerText =
      "z ≈ " + z.toFixed(4);

    shade = board.create('curve',[
      Array.from({length:100},(_,i)=>-4+i*(z+4)/99),
      Array.from({length:100},(_,i)=>normal(-4+i*(z+4)/99))
    ],{fillOpacity:0.3});
  }

  if(mode!=='invnorm'){
    document.getElementById('result').innerText =
      "Area ≈ " + area.toFixed(4);
  }

  board.update();
}

document.querySelectorAll('input,select').forEach(e=>{
  e.addEventListener('input',update);
});

update();

</script>

</body>
</html>
