<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Statistics Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

.container {
  display: flex;
  gap: 20px;
}

.panel {
  width: 320px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.graph {
  flex: 1;
  height: 520px;
  background: white;
  border-radius: 10px;
}

input, select {
  width: 100%;
  margin: 6px 0;
  padding: 6px;
}
</style>
</head>

<body>

<h2>Statistics Calculator (Z & t)</h2>

<div class="container">

<!-- CONTROLS -->
<div class="panel">

<label>Distribution</label>
<select id="dist">
  <option value="z">Z</option>
  <option value="t">t</option>
</select>

<label>Mode</label>
<select id="mode">
  <option value="left">P(X < z₁)</option>
  <option value="right">P(X > z₁)</option>
  <option value="between">P(z₁ < X < z₂)</option>
  <option value="invnorm">invNorm</option>
  <option value="invt">invT</option>
</select>

<label>z₁ / p-value</label>
<input id="z1" type="number" value="0" step="0.1">

<label>z₂</label>
<input id="z2" type="number" value="1" step="0.1">

<label>df (t only)</label>
<input id="df" type="number" value="10">

<div id="result" style="margin-top:10px;font-weight:bold;"></div>

</div>

<!-- GRAPH -->
<div id="box" class="graph"></div>

</div>

<script>

// ================= BOARD =================
const board = JXG.JSXGraph.initBoard('box', {
  boundingbox: [-4, 0.45, 4, -0.05],
  axis: true
});

// ================= PDFs =================
function normal(x){
  return (1/Math.sqrt(2*Math.PI))*Math.exp(-0.5*x*x);
}

function t(x, df){
  return (1/Math.sqrt(df*Math.PI))*Math.pow(1 + x*x/df, -(df+1)/2);
}

// ================= INTEGRATION =================
function integrate(f,a,b,df=null){
  let steps = 300;
  let h = (b-a)/steps;
  let sum = 0;

  for(let i=0;i<steps;i++){
    let x1 = a + i*h;
    let x2 = a + (i+1)*h;

    let y1 = df ? f(x1,df) : f(x1);
    let y2 = df ? f(x2,df) : f(x2);

    sum += (y1+y2)/2*h;
  }
  return sum;
}

// ================= INVERSE NORMAL =================
function invNorm(p){
  let a=[-39.6968,220.9461,-275.9285,138.3578,-30.6648,2.5066];
  let b=[-54.4761,161.5858,-155.6990,66.8013,-13.2807];
  let c=[-0.00778,-0.32239,-2.40075,-2.54973,4.37466,2.93816];
  let d=[0.00778,0.32246,2.44513,3.75440];

  let q;

  if(p < 0.5){
    q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else {
    q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

// ================= INVERSE T =================
function invT(p, df){
  let low = -10, high = 10;

  for(let i=0;i<60;i++){
    let mid = (low+high)/2;
    let cdf = integrate(t,-10,mid,df);

    if(cdf < p) low = mid;
    else high = mid;
  }

  return (low+high)/2;
}

// ================= STATE =================
let fillPoly = null;
let curve = board.create('functiongraph',[normal,-4,4]);

// ================= UPDATE =================
function update(){

  let dist = document.getElementById('dist').value;
  let mode = document.getElementById('mode').value;
  let z1 = parseFloat(document.getElementById('z1').value);
  let z2 = parseFloat(document.getElementById('z2').value);
  let df = parseFloat(document.getElementById('df').value);

  let pdf = (dist==='z') ? normal : (x)=>t(x,df);

  if(fillPoly){
    board.removeObject(fillPoly);
    fillPoly = null;
  }

  let area = 0;

  // ================= LEFT =================
  if(mode==='left'){
    area = integrate(pdf,-4,z1,dist==='t'?df:null);

    let xs=[], ys=[];
    for(let i=0;i<=120;i++){
      let x = -4 + i*(z1+4)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }

    xs.push(z1,-4);
    ys.push(0,0);

    fillPoly = board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3, borders:{strokeWidth:0}});
  }

  // ================= RIGHT =================
  else if(mode==='right'){
    area = integrate(pdf,z1,4,dist==='t'?df:null);

    let xs=[], ys=[];
    for(let i=0;i<=120;i++){
      let x = z1 + i*(4-z1)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }

    xs.push(4,z1);
    ys.push(0,0);

    fillPoly = board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3, borders:{strokeWidth:0}});
  }

  // ================= BETWEEN =================
  else if(mode==='between'){
    area = integrate(pdf,z1,z2,dist==='t'?df:null);

    let xs=[], ys=[];
    for(let i=0;i<=120;i++){
      let x = z1 + i*(z2-z1)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }

    xs.push(z2,z1);
    ys.push(0,0);

    fillPoly = board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3, borders:{strokeWidth:0}});
  }

  // ================= INVERSE NORMAL =================
  else if(mode==='invnorm'){
    let z = invNorm(z1);
    document.getElementById('result').innerText =
      "z ≈ " + z.toFixed(4);
  }

  // ================= INVERSE T =================
  else if(mode==='invt'){
    let tval = invT(z1, df);
    document.getElementById('result').innerText =
      "t ≈ " + tval.toFixed(4);
  }

  else {
    document.getElementById('result').innerText =
      "Area ≈ " + area.toFixed(4);
  }
}

// ================= EVENTS =================
document.querySelectorAll('input,select').forEach(e=>{
  e.addEventListener('input',update);
});

update();

</script>

</body>
</html>
