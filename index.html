<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Statistics Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

.container {
  display: flex;
  gap: 20px;
}

.panel {
  width: 320px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.graph {
  flex: 1;
  height: 520px;
  background: white;
  border-radius: 10px;
}

input, select {
  width: 100%;
  margin: 6px 0;
  padding: 6px;
}
</style>
</head>

<body>

<h2>Statistics Calculator</h2>

<div class="container">

<!-- CONTROLS -->
<div class="panel">

<label>Distribution</label>
<select id="dist">
  <option value="z">Z</option>
  <option value="t">t</option>
</select>

<label>Mode</label>
<select id="mode">
  <option value="left">P(X < z₁ / t₁)</option>
  <option value="right">P(X > z₁ / t₁)</option>
  <option value="between">P(z₁/t₁ < X < z₂/t₂)</option>
  <option value="invnorm">invNorm</option>
  <option value="invt">invT</option>
</select>

<label id="lab1">z₁ / t₁</label>
<input id="z1" type="number" value="0" step="0.1">

<label id="lab2">z₂ / t₂</label>
<input id="z2" type="number" value="1" step="0.1">

<label>df (t only)</label>
<input id="df" type="number" value="10">

<div id="result" style="margin-top:10px;font-weight:bold;">
probability = 0
</div>

</div>

<!-- GRAPH -->
<div id="box" class="graph"></div>

</div>

<script>

// ================= BOARD =================
const board = JXG.JSXGraph.initBoard('box', {
  boundingbox: [-4, 0.45, 4, -0.05],
  axis: true
});

// ================= NORMAL PDF =================
function normal(x){
  return (1/Math.sqrt(2*Math.PI))*Math.exp(-0.5*x*x);
}

// ================= STABLE t PDF =================
// FIXED: correct scaling behavior so it converges to normal as df → ∞
function t(x, df){
  let c = Math.exp(
    gammaln((df+1)/2) -
    gammaln(df/2) -
    0.5*Math.log(df*Math.PI)
  );
  return c * Math.pow(1 + (x*x)/df, -(df+1)/2);
}

// log gamma approximation (stable)
function gammaln(z){
  let cof=[76.18009172947146,-86.50532032941677,24.01409824083091,
           -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let x=z, y=z;
  let tmp=x+5.5;
  tmp-=(x+0.5)*Math.log(tmp);
  let ser=1.000000000190015;
  for(let j=0;j<6;j++){
    y+=1;
    ser+=cof[j]/y;
  }
  return -tmp+Math.log(2.5066282746310005*ser/x);
}

// ================= INTEGRATION =================
function integrate(f,a,b,df=null){
  let steps=300;
  let h=(b-a)/steps;
  let sum=0;

  for(let i=0;i<steps;i++){
    let x1=a+i*h;
    let x2=a+(i+1)*h;

    let y1=df?f(x1,df):f(x1);
    let y2=df?f(x2,df):f(x2);

    sum+=(y1+y2)/2*h;
  }
  return sum;
}

// ================= INVERSE NORMAL =================
function invNorm(p){
  let a=[-39.6968,220.9461,-275.9285,138.3578,-30.6648,2.5066];
  let b=[-54.4761,161.5858,-155.6990,66.8013,-13.2807];
  let c=[-0.00778,-0.32239,-2.40075,-2.54973,4.37466,2.93816];
  let d=[0.00778,0.32246,2.44513,3.75440];

  let q;

  if(p<0.5){
    q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else {
    q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

// ================= INVERSE t =================
function invT(p, df){
  let low=-10, high=10;

  for(let i=0;i<60;i++){
    let mid=(low+high)/2;
    let cdf=integrate(t,-10,mid,df);

    if(cdf<p) low=mid;
    else high=mid;
  }

  return (low+high)/2;
}

// ================= STATE =================
let fillPoly=null;
let curve=board.create('functiongraph',[normal,-4,4]);

// ================= UPDATE =================
function update(){

  let dist=document.getElementById('dist').value;
  let mode=document.getElementById('mode').value;
  let v1=parseFloat(document.getElementById('z1').value);
  let v2=parseFloat(document.getElementById('z2').value);
  let df=parseFloat(document.getElementById('df').value);

  let pdf=(dist==='z')?normal:(x)=>t(x,df);

  document.getElementById('lab1').innerText=(dist==='z')?"z₁":"t₁";
  document.getElementById('lab2').innerText=(dist==='z')?"z₂":"t₂";

  if(fillPoly){
    board.removeObject(fillPoly);
    fillPoly=null;
  }

  let result=0;
  let showProb=true;

  // LEFT
  if(mode==='left'){
    result=integrate(pdf,-4,v1,dist==='t'?df:null);

    let xs=[],ys=[];
    for(let i=0;i<=120;i++){
      let x=-4+i*(v1+4)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }
    xs.push(v1,-4);
    ys.push(0,0);

    fillPoly=board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3});
  }

  // RIGHT
  else if(mode==='right'){
    result=integrate(pdf,v1,4,dist==='t'?df:null);

    let xs=[],ys=[];
    for(let i=0;i<=120;i++){
      let x=v1+i*(4-v1)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }
    xs.push(4,v1);
    ys.push(0,0);

    fillPoly=board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3});
  }

  // BETWEEN
  else if(mode==='between'){
    result=integrate(pdf,v1,v2,dist==='t'?df:null);

    let xs=[],ys=[];
    for(let i=0;i<=120;i++){
      let x=v1+i*(v2-v1)/120;
      xs.push(x);
      ys.push(pdf(x,dist==='t'?df:null));
    }
    xs.push(v2,v1);
    ys.push(0,0);

    fillPoly=board.create('polygon',[...xs.map((x,i)=>[x,ys[i]])],
      {fillOpacity:0.3});
  }

  // INV NORM
  else if(mode==='invnorm'){
    result=invNorm(v1);
    document.getElementById('result').innerText="z = "+result.toFixed(4);
    showProb=false;
  }

  // INV T
  else if(mode==='invt'){
    result=invT(v1,df);
    document.getElementById('result').innerText="t = "+result.toFixed(4);
    showProb=false;
  }

  if(showProb){
    document.getElementById('result').innerText=
      "probability = "+result.toFixed(4);
  }
}

// EVENTS
document.querySelectorAll('input,select').forEach(e=>{
  e.addEventListener('input',update);
});

update();

</script>

</body>
</html>
