<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Unified Stats Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css">

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

.container {
  display: flex;
  gap: 20px;
}

.panel {
  width: 360px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.graph {
  flex: 1;
  height: 520px;
  background: white;
  border-radius: 10px;
}

input, select {
  width: 100%;
  margin: 6px 0;
  padding: 6px;
}

.hidden { display:none; }
</style>
</head>

<body>

<h2>Unified Statistics Calculator</h2>

<div class="container">

<div class="panel">

<label>Mode</label>
<select id="mode">
  <option value="z">Z distribution</option>
  <option value="invz">Inverse Z</option>
  <option value="t">t distribution</option>
  <option value="invt">Inverse t</option>
</select>

<label>Operation</label>
<select id="op">
  <option value="lt">Less than</option>
  <option value="gt">Greater than</option>
  <option value="out">Outside</option>
</select>

<label id="lab1">x₁</label>
<input id="x1" type="number" value="0" step="0.1">

<label id="lab2">x₂</label>
<input id="x2" type="number" value="1" step="0.1">

<label id="dfLabel">df (t only)</label>
<input id="df" type="number" value="10">

<div id="result" style="margin-top:10px;font-weight:bold;">
result = 0
</div>

</div>

<div id="box" class="graph"></div>

</div>

<script>

// ================= BOARD =================
const board = JXG.JSXGraph.initBoard('box', {
  boundingbox: [-4, 0.45, 4, -0.05],
  axis: true
});

// ================= PDFS =================
function normal(x){
  return (1/Math.sqrt(2*Math.PI))*Math.exp(-0.5*x*x);
}

function t(x, df){
  let num = gamma((df+1)/2);
  let den = Math.sqrt(df*Math.PI) * gamma(df/2);
  return (num/den) * Math.pow(1 + (x*x)/df, -(df+1)/2);
}

// gamma approximation
function gamma(z){
  let p = [
    0.99999999999980993,
    676.5203681218851,
    -1259.1392167224028,
    771.32342877765313,
    -176.61502916214059,
    12.507343278686905,
    -0.13857109526572012,
    9.9843695780195716e-6,
    1.5056327351493116e-7
  ];

  let g = 7;
  if(z < 0.5) return Math.PI / (Math.sin(Math.PI*z)*gamma(1-z));

  z -= 1;
  let x = p[0];
  for(let i=1;i<p.length;i++) x += p[i]/(z+i);

  let tt = z + g + 0.5;
  return Math.sqrt(2*Math.PI)*Math.pow(tt,z+0.5)*Math.exp(-tt)*x;
}

// ================= CLEAN STATE SYSTEM =================
let objects = [];

function clearAll(){
  objects.forEach(o => board.removeObject(o));
  objects = [];
}

// ================= INTEGRATION =================
function integrate(f,a,b,df=null){
  let steps=300;
  let h=(b-a)/steps;
  let sum=0;

  for(let i=0;i<steps;i++){
    let x1=a+i*h;
    let x2=a+(i+1)*h;

    let y1=df?f(x1,df):f(x1);
    let y2=df?f(x2,df):f(x2);

    sum+=(y1+y2)/2*h;
  }
  return sum;
}

// ================= INVERSE NORMAL =================
function invNorm(p){
  let a=[-39.6968,220.9461,-275.9285,138.3578,-30.6648,2.5066];
  let b=[-54.4761,161.5858,-155.6990,66.8013,-13.2807];
  let c=[-0.00778,-0.32239,-2.40075,-2.54973,4.37466,2.93816];
  let d=[0.00778,0.32246,2.44513,3.75440];

  let q;

  if(p<0.5){
    q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else {
    q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
             ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
}

// ================= INVERSE T =================
function invT(p, df){
  let low=-10, high=10;

  for(let i=0;i<60;i++){
    let mid=(low+high)/2;
    let cdf=integrate(t,-10,mid,df);

    if(cdf<p) low=mid;
    else high=mid;
  }

  return (low+high)/2;
}

// ================= MARKERS =================
function line(x){
  let l = board.create('line', [[x,0],[x,0.45]], {
    dash:2,
    strokeColor:'black',
    strokeWidth:1
  });
  objects.push(l);
}

function label(x, txt){
  let t = board.create('text',[x,-0.02,txt]);
  objects.push(t);
}

// ================= CURVE =================
function curve(a,b,pdf,df,color,width){
  let c = board.create('functiongraph',[df?x=>pdf(x,df):pdf,a,b],{
    strokeColor:color,
    strokeWidth:width
  });
  objects.push(c);
  return c;
}

// ================= UPDATE =================
function update(){

  clearAll();

  let mode=document.getElementById('mode').value;
  let op=document.getElementById('op').value;

  let x1=parseFloat(document.getElementById('x1').value);
  let x2=parseFloat(document.getElementById('x2').value);
  let df=parseFloat(document.getElementById('df').value);

  let pdf = (mode==='z'||mode==='invz') ? normal : (x)=>t(x,df);

  document.getElementById('df').style.display =
    (mode==='t'||mode==='invt') ? 'block' : 'none';

  let result=0;

  // ================= PROBABILITY MODES =================
  if(mode==='z' || mode==='t'){

    if(op==='lt'){
      result = integrate(pdf,-4,x1,mode==='t'?df:null);

      curve(-4,x1,pdf,df,'orange',4);
      line(x1);
      label(x1,x1.toFixed(2));
    }

    else if(op==='gt'){
      result = integrate(pdf,x1,4,mode==='t'?df:null);

      curve(x1,4,pdf,df,'orange',4);
      line(x1);
      label(x1,x1.toFixed(2));
    }

    else if(op==='out'){
      result =
        integrate(pdf,-4,x1,mode==='t'?df:null) +
        integrate(pdf,x2,4,mode==='t'?df:null);

      curve(-4,x1,pdf,df,'orange',4);
      curve(x2,4,pdf,df,'orange',4);

      line(x1); line(x2);
      label(x1,x1.toFixed(2));
      label(x2,x2.toFixed(2));
    }

    document.getElementById('result').innerText =
      "probability = " + result.toFixed(4);
  }

  // ================= INV Z =================
  else if(mode==='invz'){
    result = invNorm(x1);

    curve(-4,result,normal,null,'orange',4);
    line(result);
    label(result,result.toFixed(2));

    document.getElementById('result').innerText =
      "z = " + result.toFixed(4);
  }

  // ================= INV T =================
  else if(mode==='invt'){
    result = invT(x1,df);

    curve(-4,result,t,df,'orange',4);
    line(result);
    label(result,result.toFixed(2));

    document.getElementById('result').innerText =
      "t = " + result.toFixed(4);
  }
}

// EVENTS
document.querySelectorAll('input,select').forEach(e=>{
  e.addEventListener('input',update);
});

update();

</script>

</body>
</html>
